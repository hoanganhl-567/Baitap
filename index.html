<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-4">BẢNG QUẢN LÝ SẢN PHẨM</h2>

    <!-- Thanh tìm kiếm -->
    <div class="row mb-3">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên..." oninput="searchByName()">
        </div>

        <!-- Nút sắp xếp -->
        <div class="col-md-6 text-end">
            <button class="btn btn-primary me-2" onclick="sortByName()">Sắp xếp tên ↑↓</button>
            <button class="btn btn-success" onclick="sortByPrice()">Sắp xếp giá ↑↓</button>
        </div>
    </div>

    <!-- Bảng dữ liệu -->
    <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
            </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
